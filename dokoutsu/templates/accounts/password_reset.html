{% extends "base.html" %}
{% block content %}
<h1>パスワード再発行</h1>
{% if sent_email %}
  <p>{{ sent_email }} 宛に再設定用のメールを送信しました。有効期限は60分です。</p>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="email" value="{{ sent_email }}">
    <button type="submit">メールを再送する</button>
  </form>
{% else %}
  <p>ご登録のメールアドレスに、再設定用のリンクを送ります。</p>
  <form method="post" novalidate>
    {% csrf_token %}
    <label for="{{ form.email.id_for_label }}">メールアドレス</label>
    {{ form.email }}
    {{ form.email.errors }}
    <button type="submit">再設定リンクを送る</button>
  </form>
{% endif %}
<a href="{% url 'login' %}">ログイン画面に戻る</a>
{% endblock %}
