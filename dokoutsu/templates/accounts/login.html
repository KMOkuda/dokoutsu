{% extends "base.html" %}
{% block content %}
<div class="form-section">
  <h1 class="accent-title">ログイン</h1>
  {% if activation_error %}<p class="errorlist" role="alert">{{ activation_error }}</p>{% endif %}
  <form method="post" data-required-fields="login_id password" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="field">
      <label for="{{ form.login_id.id_for_label }}">ID またはメールアドレス</label>
      {{ form.login_id }}
      {{ form.login_id.errors }}
    </div>
    <div class="field">
      <label for="{{ form.password.id_for_label }}">パスワード</label>
      {{ form.password }}
      {{ form.password.errors }}
    </div>
    <div class="field inline-row">
      <label class="check-inline"><input type="checkbox" name="remember" {% if form.remember.value %}checked{% endif %}> ログイン状態を保持する</label>
      <a class="text-link" href="{% url 'password_reset' %}">パスワードを忘れた方</a>
    </div>
    <button type="submit">ログイン</button>
  </form>
  <p class="center-link"><a class="text-link" href="{% url 'signup' %}">新規登録はこちら</a></p>
</div>
{% endblock %}
