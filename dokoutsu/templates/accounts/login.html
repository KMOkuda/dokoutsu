{% extends "base.html" %}
{% block content %}
<h1>ログイン</h1>
{% if activation_error %}<p role="alert">{{ activation_error }}</p>{% endif %}
<form method="post" novalidate>
  {% csrf_token %}
  {{ form.non_field_errors }}
  <div>
    <label for="{{ form.login_id.id_for_label }}">IDまたはメールアドレス</label>
    {{ form.login_id }}
  </div>
  <div>
    <label for="{{ form.password.id_for_label }}">パスワード</label>
    {{ form.password }}
  </div>
  <div>
    <label><input type="checkbox" name="remember" {% if form.remember.value %}checked{% endif %}> ログイン状態を保持する</label>
    <a href="{% url 'password_reset' %}">パスワードを忘れた方はこちら</a>
  </div>
  <button type="submit">ログイン</button>
</form>
<a href="{% url 'signup' %}">新規登録はこちら</a>
{% endblock %}
