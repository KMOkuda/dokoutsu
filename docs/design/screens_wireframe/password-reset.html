<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>パスワード再発行</title>
</head>
<body>
<main>

  <section aria-labelledby="reset-heading">
    <header><span>どこ打つくん</span></header>
    <h1 id="reset-heading">パスワード再発行</h1>
    <p>ご登録のメールアドレスに、再設定用のリンクを送ります。</p>
    <form>
      <div>
        <label for="reset-email">メールアドレス</label>
        <input id="reset-email" type="email" name="email">
      </div>
      <button type="submit">再設定リンクを送る</button>
    </form>
    <p><a href="login.html">ログイン画面に戻る</a></p>
  </section>

  <section aria-labelledby="reset-sent-heading" hidden>
    <header><span>どこ打つくん</span></header>
    <h1 id="reset-sent-heading">メールを送りました</h1>
    <dl>
      <dt>送信先</dt>
      <dd>you@example.com</dd>
    </dl>
    <p>メール内のリンクから新しいパスワードを設定してください。リンクの有効期限は60分です。</p>
    <button type="button">メールを再送する</button>
    <p><a href="login.html">ログイン画面に戻る</a></p>
  </section>

  <section aria-labelledby="reset-new-heading" hidden>
    <header><span>どこ打つくん</span></header>
    <h1 id="reset-new-heading">新しいパスワード</h1>
    <form>
      <div>
        <label for="new-password">新しいパスワード</label>
        <input id="new-password" type="password" name="password">
        <p>8文字以上、英字と数字を組み合わせてください。</p>
      </div>
      <div>
        <label for="new-password-confirm">新しいパスワード（確認）</label>
        <input id="new-password-confirm" type="password" name="password-confirm">
      </div>
      <button type="submit">パスワードを変更する</button>
    </form>
  </section>

  <section aria-labelledby="reset-done-heading" hidden>
    <header><span>どこ打つくん</span></header>
    <h1 id="reset-done-heading">変更しました</h1>
    <p>新しいパスワードでログインできます。</p>
    <a href="login.html">ログインする</a>
  </section>

</main>

</body>
</html>
